specVersion: 0.0.6
description: rethinkfinance
repository: https://github.com/rethink-finance/rethink-subgraph
schema:
  file: ./schema.graphql
# HyperEVM (chain 999) | host: Goldsky | explorer: https://purrsec.com
# Factory 0x9825a0…8d45 is GovernableFundFactoryV1.5 (verified: responds to
# getFundInitializationCache, reverts on the V1 createFund selector).
# Deployed at block 4472119; first fund created at 34309751 — starting there.
# SOURCES
dataSources:
  # ====================== GovernableFundFactoryV1.5 ======================
  - kind: ethereum/contract
    name: GovernableFundFactoryV1.5
    network: hyperevm
    source:
      address: "0x9825a09fBc727bB671f08fa66e3508A2e8938d45"
      abi: GovernableFundFactoryV1.5
      startBlock: 34309751
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - GovernableFund
      abis:
        - name: GovernableFundFactoryV1.5
          file: ./abis/GovernableFundFactoryV1.5.json
        - name: RethinkFundGovernor
          file: ./abis/RethinkFundGovernor.json
        - name: ERC20Votes
          file: ./abis/ERC20Votes.json
      eventHandlers:
        - event: GovernableFundFactory_CreatedAndInitializedFundEvent(address,address,address,address,address,string)
          handler: handleGovernableFundFactoryV2_CreatedAndInitializedFundEvent
      file: ./mappings/GovernableFundFactoryV2.mapping.ts
  # ====================== GovernableFundFactoryV1.5RolesV2 ======================
  # Roles V2 factory (Zodiac Roles V2 modifiers), proxy created at block
  # 42478024 in tx 0xfbe211ab873bdb25ae5fce261f6a18d768b8db38fde65c065a6d46ae3644700d.
  - kind: ethereum/contract
    name: GovernableFundFactoryV1.5RolesV2
    network: hyperevm
    source:
      address: "0x8Ac19ed0280c3ea1A89C6209ACA862Db0Cb5Ffa8"
      abi: GovernableFundFactoryV1.5
      startBlock: 42478024
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - GovernableFund
      abis:
        - name: GovernableFundFactoryV1.5
          file: ./abis/GovernableFundFactoryV1.5.json
        - name: RethinkFundGovernor
          file: ./abis/RethinkFundGovernor.json
        - name: ERC20Votes
          file: ./abis/ERC20Votes.json
      eventHandlers:
        - event: GovernableFundFactory_CreatedAndInitializedFundEvent(address,address,address,address,address,string)
          handler: handleGovernableFundFactoryV2_CreatedAndInitializedFundEvent
      file: ./mappings/GovernableFundFactoryV2.mapping.ts
# TEMPLATES
templates:
  # ====================== RethinkFundGovernor ======================
  - kind: ethereum/contract
    name: RethinkFundGovernor
    network: hyperevm
    source:
      abi: RethinkFundGovernor
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Governor
      abis:
        - name: RethinkFundGovernor
          file: ./abis/RethinkFundGovernor.json
      eventHandlers:
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: handleVoteCastWithParams
      file: ./mappings/RethinkFundGovernor.mapping.ts
  # ====================== ERC20Votes ======================
  - kind: ethereum/contract
    name: ERC20Votes
    network: hyperevm
    source:
      abi: ERC20Votes
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - VotingContract
      abis:
        - name: ERC20Votes
          file: ./abis/ERC20Votes.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: ./mappings/Voting.mapping.ts
  # ====================== GovernableFund ======================
  - kind: ethereum/contract
    name: GovernableFund
    network: hyperevm
    source:
      abi: GovernableFund
    mapping:
      kind: ethereum/call
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - FundFlow
      abis:
        - name: GovernableFund
          file: ./abis/GovernableFund.json
      callHandlers:
        - function: fundFlowsCall(bytes)
          handler: handleFundFlowsCall
      file: ./mappings/GovernableFund.mapping.ts
